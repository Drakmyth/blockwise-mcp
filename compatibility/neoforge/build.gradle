plugins {
    id 'java'
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}"
}

var blockwiseModJar = providers.gradleProperty('blockwise_mod_jar')
        .map { rootProject.file(it) }
        .orElse(layout.projectDirectory.file('missing-blockwise-mod.jar').asFile)
var blockwiseGameTestJar = providers.gradleProperty('blockwise_gametest_jar')
        .map { rootProject.file(it) }
        .orElse(layout.projectDirectory.file('missing-blockwise-gametest.jar').asFile)

dependencies {
    runtimeOnly files(blockwiseModJar, blockwiseGameTestJar)
}

neoForge {
    version = project.findProperty('neoforge_test_version') ?: project.neoforge_version

    runs {
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'blockwisemcp'
            systemProperty 'blockwise.test.expectedVersion', project.version.toString()
        }
    }
}

var generateGameTestServerProperties = tasks.register('generateGameTestServerProperties') {
    var outputFile = layout.projectDirectory.file('run/server.properties')
    outputs.file outputFile

    doLast {
        outputFile.asFile.parentFile.mkdirs()
        outputFile.asFile.text = 'online-mode=false\n'
    }
}

tasks.named('runGameTestServer') {
    dependsOn generateGameTestServerProperties
    doFirst {
        if (!blockwiseModJar.get().isFile()) {
            throw new GradleException('Set -Pblockwise_mod_jar to a packaged Blockwise mod JAR')
        }
        if (!blockwiseGameTestJar.get().isFile()) {
            throw new GradleException('Set -Pblockwise_gametest_jar to a packaged Blockwise GameTest JAR')
        }
    }
}
