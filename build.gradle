plugins {
    id 'base'
}

allprojects {
    group = 'com.drakmyth.minecraft.blockwise'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(21)
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }
}
