name: Build

on:
    pull_request:
        branches:
            - master

permissions:
    contents: read

concurrency:
    group: build-${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            required: ${{ steps.changes.outputs.required }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Detect build-impacting changes
              id: changes
              shell: bash
              run: |
                  required=false
                  while IFS= read -r path; do
                      if [[ "$path" != docs/* && "$path" != *.md ]]; then
                          required=true
                          break
                      fi
                  done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
                  echo "required=$required" >> "$GITHUB_OUTPUT"

    build:
        needs: changes
        if: needs.changes.outputs.required == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Java 21
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-read-only: ${{ github.event.pull_request.head.repo.fork }}

            - name: Build against minimum NeoForge
              run: ./gradlew :core:build :mcp-server:build :loaders:fabric:1.21.1:build :loaders:neoforge:1.21.1:build

            - name: Upload NeoForge mod
              uses: actions/upload-artifact@v7
              with:
                  name: blockwise-neoforge-mod
                  path: loaders/neoforge/1.21.1/build/libs/*.jar
                  if-no-files-found: error
                  overwrite: true

            - name: Upload Fabric mod
              uses: actions/upload-artifact@v7
              with:
                  name: blockwise-fabric-mod
                  path: |
                      loaders/fabric/1.21.1/build/libs/*.jar
                      !loaders/fabric/1.21.1/build/libs/*-gametest*.jar
                  if-no-files-found: error
                  overwrite: true

            - name: Upload Fabric GameTest mod
              uses: actions/upload-artifact@v7
              with:
                  name: blockwise-fabric-gametest
                  path: loaders/fabric/1.21.1/build/libs/*-gametest.jar
                  if-no-files-found: error
                  overwrite: true

    validation:
        name: validation (${{ matrix.target }})
        needs:
            - changes
            - build
        if: >-
            always() && needs.changes.result == 'success' &&
            (needs.changes.outputs.required == 'false' || needs.build.result == 'success')
        strategy:
            fail-fast: false
            matrix:
                target:
                    - minimum
                    - latest
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              if: needs.changes.outputs.required == 'true'
              uses: actions/checkout@v7

            - name: Download distributable mod
              if: needs.changes.outputs.required == 'true'
              uses: actions/download-artifact@v8
              with:
                  name: blockwise-neoforge-mod
                  path: compatibility-artifact

            - name: Select compatibility inputs
              if: needs.changes.outputs.required == 'true'
              id: compatibility
              shell: bash
              run: |
                  if [[ "${{ matrix.target }}" == "minimum" ]]; then
                      property=neoforge_version
                  else
                      property=neoforge_latest_version
                  fi
                  version=$(grep "^$property=" gradle.properties | cut -d= -f2-)
                  mod_jar=$(find compatibility-artifact -name '*.jar' -type f -print -quit)
                  echo "neoforge_version=$version" >> "$GITHUB_OUTPUT"
                  echo "mod_jar=$GITHUB_WORKSPACE/$mod_jar" >> "$GITHUB_OUTPUT"

            - name: Set up Java 21
              if: needs.changes.outputs.required == 'true'
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Set up Gradle
              if: needs.changes.outputs.required == 'true'
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-read-only: ${{ github.event.pull_request.head.repo.fork }}

            - name: Run packaged-mod GameTests
              if: needs.changes.outputs.required == 'true'
              shell: bash
              run: |
                  set -o pipefail
                  ./gradlew :compatibility:neoforge:runGameTestServer \
                      -Pneoforge_test_version=${{ steps.compatibility.outputs.neoforge_version }} \
                      -Pblockwise_mod_jar=${{ steps.compatibility.outputs.mod_jar }} \
                      | tee gametest.log
                  grep -E 'All [1-9][0-9]* required tests passed :\)' gametest.log

    fabric-validation:
        name: fabric validation (${{ matrix.target }})
        needs:
            - changes
            - build
        if: >-
            always() && needs.changes.result == 'success' &&
            (needs.changes.outputs.required == 'false' || needs.build.result == 'success')
        strategy:
            fail-fast: false
            matrix:
                target:
                    - minimum
                    - latest
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              if: needs.changes.outputs.required == 'true'
              uses: actions/checkout@v7

            - name: Download Fabric mod
              if: needs.changes.outputs.required == 'true'
              uses: actions/download-artifact@v8
              with:
                  name: blockwise-fabric-mod
                  path: compatibility-artifact

            - name: Download Fabric GameTest mod
              if: needs.changes.outputs.required == 'true'
              uses: actions/download-artifact@v8
              with:
                  name: blockwise-fabric-gametest
                  path: gametest-artifact

            - name: Select Fabric compatibility inputs
              if: needs.changes.outputs.required == 'true'
              id: compatibility
              shell: bash
              run: |
                  if [[ "${{ matrix.target }}" == "minimum" ]]; then
                      prefix=fabric
                  else
                      prefix=fabric_latest
                  fi
                  loader=$(grep "^${prefix}_loader_version=" gradle.properties | cut -d= -f2-)
                  api=$(grep "^${prefix}_api_version=" gradle.properties | cut -d= -f2-)
                  mod_jar=$(find compatibility-artifact -name '*.jar' -type f -print -quit)
                  gametest_jar=$(find gametest-artifact -name '*.jar' -type f -print -quit)
                  echo "loader_version=$loader" >> "$GITHUB_OUTPUT"
                  echo "api_version=$api" >> "$GITHUB_OUTPUT"
                  echo "mod_jar=$GITHUB_WORKSPACE/$mod_jar" >> "$GITHUB_OUTPUT"
                  echo "gametest_jar=$GITHUB_WORKSPACE/$gametest_jar" >> "$GITHUB_OUTPUT"

            - name: Set up Java 21
              if: needs.changes.outputs.required == 'true'
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Set up Gradle
              if: needs.changes.outputs.required == 'true'
              uses: gradle/actions/setup-gradle@v6
              with:
                  cache-read-only: ${{ github.event.pull_request.head.repo.fork }}

            - name: Run packaged Fabric GameTests
              if: needs.changes.outputs.required == 'true'
              timeout-minutes: 5
              shell: bash
              run: |
                  set -o pipefail
                  timeout 180s ./gradlew :compatibility:fabric:runGameTestServer \
                      -Pfabric_test_loader_version=${{ steps.compatibility.outputs.loader_version }} \
                      -Pfabric_test_api_version=${{ steps.compatibility.outputs.api_version }} \
                      -Pblockwise_mod_jar=${{ steps.compatibility.outputs.mod_jar }} \
                      -Pblockwise_gametest_jar=${{ steps.compatibility.outputs.gametest_jar }} \
                      --no-configuration-cache \
                      | tee fabric-gametest.log
                  grep -E 'All [1-9][0-9]* required tests passed :\)' fabric-gametest.log
