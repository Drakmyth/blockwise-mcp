name: Build

on:
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '21'
                  cache: gradle

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Build
              run: ./gradlew build

            - name: Run GameTests
              run: ./gradlew :neoforge-1.21.1:runGameTestServer
