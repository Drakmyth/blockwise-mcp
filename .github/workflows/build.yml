name: Build

on:
    pull_request:
        branches:
            - master

permissions:
    contents: read

concurrency:
    group: build-${{ github.workflow }}-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            required: ${{ steps.changes.outputs.required }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Detect build-impacting changes
              id: changes
              shell: bash
              run: |
                  required=false
                  while IFS= read -r path; do
                      if [[ "$path" != docs/* && "$path" != *.md ]]; then
                          required=true
                          break
                      fi
                  done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
                  echo "required=$required" >> "$GITHUB_OUTPUT"

    validation:
        name: validation (${{ matrix.target }})
        needs: changes
        strategy:
            fail-fast: false
            matrix:
                target:
                    - minimum
                    - latest
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              if: needs.changes.outputs.required == 'true'
              uses: actions/checkout@v7

            - name: Select NeoForge version
              if: needs.changes.outputs.required == 'true'
              id: neoforge
              shell: bash
              run: |
                  if [[ "${{ matrix.target }}" == "minimum" ]]; then
                      property=neo_version
                  else
                      property=neo_latest_version
                  fi
                  version=$(grep "^$property=" gradle.properties | cut -d= -f2-)
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Set up Java 21
              if: needs.changes.outputs.required == 'true'
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: '21'

            - name: Set up Gradle
              if: needs.changes.outputs.required == 'true'
              uses: gradle/actions/setup-gradle@v6

            - name: Build against minimum NeoForge
              if: needs.changes.outputs.required == 'true' && matrix.target == 'minimum'
              run: ./gradlew build -Pneo_version=${{ steps.neoforge.outputs.version }}

            - name: Run GameTests
              if: needs.changes.outputs.required == 'true'
              run: ./gradlew :neoforge-1.21.1:runGameTestServer -Pneo_version=${{ steps.neoforge.outputs.version }}
