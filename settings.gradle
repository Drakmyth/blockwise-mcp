pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'blockwise-mcp'
include 'core', 'mcp-server', 'fabric-1.21.1', 'neoforge-1.21.1', 'neoforge-compatibility-test'
