plugins {
    id 'fabric-loom' version "${fabric_loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(':core')
    implementation project(':mcp-server')
    include project(':core')
    include project(':mcp-server')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

base {
    archivesName = "blockwise-mcp-fabric-${minecraft_version}"
}

loom {
    accessWidenerPath = file('src/main/resources/blockwisemcp.accesswidener')
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'blockwisemcp-gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

var replaceProperties = [
        mod_version: project.version,
        minecraft_version: minecraft_version,
        fabric_loader_version: fabric_loader_version,
        fabric_api_version: fabric_api_version,
]

var gametestJar = tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest-dev'
}

var remapGametestJar = tasks.register('remapGametestJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn gametestJar
    inputFile = gametestJar.flatMap { it.archiveFile }
    archiveClassifier = 'gametest'
    addNestedDependencies = false
    classpath.from configurations.gametestCompileClasspath
}

tasks.named('assemble') {
    dependsOn remapGametestJar
}

tasks.named('runGameTest') {
    jvmArgs "-Dblockwise.test.expectedVersion=${project.version}"
}

tasks.named('test') {
    useJUnitPlatform()
}

processResources {
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}
