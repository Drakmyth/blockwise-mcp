plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}"
}

dependencies {
    implementation project(':core')
    implementation project(':mcp-server')
    jarJar project(':core')
    jarJar project(':mcp-server')
}

base {
    archivesName = "blockwisemcp-${minecraft_version}"
}

tasks.named('jar') {
    archiveClassifier = 'neoforge'
}

tasks.withType(AbstractArchiveTask).configureEach {
    doFirst {
        if (archiveFileName.get().contains('${')) {
            throw new GradleException("Archive filename contains an unresolved placeholder: ${archiveFileName.get()}")
        }
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'blockwisemcp'
            systemProperty 'blockwise.test.expectedVersion', project.version.toString()
        }
    }

    mods {
        blockwisemcp {
            sourceSet sourceSets.main
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            mod_version: project.version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

var generateGameTestServerProperties = tasks.register('generateGameTestServerProperties') {
    var outputFile = layout.projectDirectory.file('run/server.properties')
    outputs.file outputFile

    doLast {
        outputFile.asFile.parentFile.mkdirs()
        outputFile.asFile.text = 'online-mode=false\n'
    }
}

tasks.named('runGameTestServer') {
    dependsOn generateGameTestServerProperties
}
