plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${neoforge_moddev_version}"
}

sourceSets {
    gametest
}

dependencies {
    implementation project(':core')
    implementation project(':mcp-server')
    jarJar project(':core')
    jarJar project(':mcp-server')

    gametestImplementation sourceSets.main.output
    gametestImplementation project(':core')
    gametestImplementation project(':contract-tests')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

base {
    archivesName = "blockwisemcp-${minecraft_version}"
}

tasks.named('jar') {
    archiveClassifier = 'neoforge'
}

tasks.withType(AbstractArchiveTask).configureEach {
    doFirst {
        if (archiveFileName.get().contains('${')) {
            throw new GradleException("Archive filename contains an unresolved placeholder: ${archiveFileName.get()}")
        }
    }
}

neoForge {
    version = project.neoforge_version
    addModdingDependenciesTo sourceSets.gametest

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'blockwisemcp'
            systemProperty 'blockwise.test.expectedVersion', project.version.toString()
        }
    }

    mods {
        blockwisemcp {
            sourceSet sourceSets.main
        }
        blockwisemcp_gametest {
            sourceSet sourceSets.gametest
            sourceSet project(':contract-tests').sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.blockwisemcp
        loadedMods = [mods.blockwisemcp]
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            mod_version: project.version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

var gameTestProperties = [
        minecraft_version_range: minecraft_version_range,
        neoforge_version_range: neoforge_version_range,
        neoforge_loader_version_range: neoforge_loader_version_range,
        mod_version: project.version,
]

tasks.named('processGametestResources') {
    inputs.properties gameTestProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand gameTestProperties
    }
}

var gametestJar = tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    from project(':contract-tests').sourceSets.main.output
    archiveBaseName = "blockwisemcp-gametest-${minecraft_version}"
    archiveClassifier = 'neoforge'
}

tasks.named('assemble') {
    dependsOn gametestJar
}

tasks.named('test') {
    useJUnitPlatform()
}

var generateGameTestServerProperties = tasks.register('generateGameTestServerProperties') {
    var outputFile = layout.projectDirectory.file('run/server.properties')
    outputs.file outputFile

    doLast {
        outputFile.asFile.parentFile.mkdirs()
        outputFile.asFile.text = 'online-mode=false\n'
    }
}

tasks.named('runGameTestServer') {
    dependsOn generateGameTestServerProperties
}
